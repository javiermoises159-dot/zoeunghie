    thSvc: "Servicio", thPrice: "Precio €", thCost: "Material €", thMin: "Minutos", thGain: "Te queda €", thHour: "€ por hora", addRow: "+ Añadir servicio",
    rNeed: "Para ganar {g} € netos necesitas unos <b class='big'>{n} servicios al mes</b> ({w} a la semana), con una ganancia media de {a} € por servicio.",
    rTime: "Son unas {h} horas a la semana: entras en las {max} horas que tienes.", rOver: "Serían unas {h} horas a la semana, más de las {max} que tienes: sube un poco los precios u ofrece servicios que rindan más por hora.",
    rLow: "Ojo: «{s}» te deja menos de 15 € por hora. Piensa en subirle el precio.",
    msgTitle: "Mensajes listos", msgHint: "Copia, cambia lo que va entre llaves {como esto} y envíalo por WhatsApp.", copy: "Copiar", copied: "Copiado", sel: "Texto seleccionado: cópialo" }
};
const st = { l: "it", lvl: "base", pick: {}, rows: SVC.map((x) => ({ ...x })) };
try { const s = JSON.parse(localStorage.getItem("zoe-risorse") || "null"); if (s) { st.l = s.l || st.l; st.pick = s.pick || {}; if (Array.isArray(s.rows) && s.rows.length) st.rows = s.rows; ["c-goal", "c-fixed", "c-tax", "c-hours"].forEach((id) => { if (s[id] != null) $(id).value = s[id]; }); } } catch (e) {}
const save = () => { try { localStorage.setItem("zoe-risorse", JSON.stringify({ l: st.l, pick: st.pick, rows: st.rows, ...Object.fromEntries(["c-goal", "c-fixed", "c-tax", "c-hours"].map((id) => [id, $(id).value])) })); } catch (e) {} };
const T = () => UI[st.l];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const num = (v) => { const n = parseFloat(String(v).replace(",", ".")); return Number.isFinite(n) ? n : 0; };
const eur = (n) => (Math.round(n * 100) / 100).toLocaleString(st.l === "es" ? "es-ES" : "it-IT", { minimumFractionDigits: n % 1 ? 2 : 0, maximumFractionDigits: 2 }) + " €";
function applyUI() {
  document.documentElement.lang = st.l;
  document.querySelectorAll("[data-t]").forEach((el) => { el.textContent = T()[el.dataset.t]; });
  document.querySelectorAll(".lang button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.l === st.l)));
  renderMat(); renderCalc(); renderMsgs();
}
function renderMat() {
  document.querySelectorAll("#mat-lvl button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === st.lvl)));
  const list = MAT.map((m, i) => ({ ...m, i })).filter((m) => st.lvl === "all" || m.lv === "base");
  const mid = (a, b) => (a + b) / 2;
  $("tot-eco").textContent = eur(list.reduce((t, m) => t + mid(m.p[0], m.p[1]), 0));
  $("tot-pro").textContent = eur(list.reduce((t, m) => t + mid(m.p[2], m.p[3]), 0));
  $("mat").innerHTML = list.map((m) => { const [nm, why] = m[st.l], pk = st.pick[m.i];
    const opt = (k, a, b, q) => `<div class="opt${pk === k ? " on" : ""}"><span><small>${k === "e" ? T().eco : T().pro}</small><span class="pr">${eur(a)}–${eur(b)}</span></span><span style="display:flex;gap:10px;align-items:center"><button type="button" class="btn" data-pick="${m.i}:${k}" aria-pressed="${pk === k}">${pk === k ? "✓" : "○"}</button><a href="${AMZ(q)}" target="_blank" rel="noopener">${T().see} ↗</a></span></div>`;
    return `<div class="item"><div class="hd"><b>${esc(nm)}</b>${m.lv === "adv" ? `<span class="lvl">${T().lvAdv}</span>` : ""}</div><p class="why">${esc(why)}</p><div class="opts">${opt("e", m.p[0], m.p[1], m.q[0])}${opt("p", m.p[2], m.p[3], m.q[1])}</div></div>`; }).join("");
  const chosen = list.filter((m) => st.pick[m.i]);
  if (chosen.length) { const tot = chosen.reduce((t, m) => t + (st.pick[m.i] === "e" ? mid(m.p[0], m.p[1]) : mid(m.p[2], m.p[3])), 0);
    $("mat").insertAdjacentHTML("afterbegin", `<div class="result"><span>${T().mine}: <b class="big">${eur(tot)}</b> · ${chosen.length}/${list.length}</span></div>`); }
}
function renderCalc() {
  const tb = $("svc"); const focus = document.activeElement && document.activeElement.dataset && document.activeElement.dataset.r ? document.activeElement.dataset.r + ":" + document.activeElement.dataset.k : null;
  const tax = num($("c-tax").value) / 100;
  tb.innerHTML = st.rows.map((r, i) => { const nm = r[st.l] || r.it || r.es || ""; const gain = r.price * (1 - tax) - r.cost; const ph = r.min > 0 ? gain / (r.min / 60) : 0;
    return `<tr><td class="name"><input type="text" data-r="${i}" data-k="name" value="${esc(nm)}" aria-label="${T().thSvc}"></td><td><input type="text" inputmode="decimal" data-r="${i}" data-k="price" value="${r.price}" aria-label="${T().thPrice}"></td><td><input type="text" inputmode="decimal" data-r="${i}" data-k="cost" value="${r.cost}" aria-label="${T().thCost}"></td><td><input type="text" inputmode="numeric" data-r="${i}" data-k="min" value="${r.min}" aria-label="${T().thMin}"></td><td>${eur(gain)}</td><td class="${ph >= 15 ? "good" : "bad"}">${eur(ph)}</td></tr>`; }).join("");
  if (focus) { const [r, k] = focus.split(":"); const el = tb.querySelector(`[data-r="${r}"][data-k="${k}"]`); if (el) { el.focus(); const v = el.value; el.setSelectionRange && el.type === "text" && el.setSelectionRange(v.length, v.length); } }
  renderResult();
}
function renderResult() {
  const tax = num($("c-tax").value) / 100, goal = num($("c-goal").value), fixed = num($("c-fixed").value), hmax = num($("c-hours").value);
  const rows = st.rows.filter((r) => r.price > 0);
  if (!rows.length) { $("result").textContent = ""; return; }
  const avgGain = rows.reduce((t, r) => t + (r.price * (1 - tax) - r.cost), 0) / rows.length, avgMin = rows.reduce((t, r) => t + r.min, 0) / rows.length;
  const n = avgGain > 0 ? Math.ceil((goal + fixed) / avgGain) : 0, w = Math.ceil(n / 4.3), h = Math.round(w * avgMin / 60);
  const low = rows.find((r) => r.min > 0 && (r.price * (1 - tax) - r.cost) / (r.min / 60) < 15);
  const t = T(), name = (r) => r[st.l] || r.it || r.es;
  $("result").className = "result" + (h > hmax || low ? " warn" : "");
  $("result").innerHTML = `<span>${t.rNeed.replace("{g}", eur(goal).replace(" €", "")).replace("{n}", n).replace("{w}", w).replace("{a}", eur(avgGain).replace(" €", ""))}</span>` +
    `<span>${(h > hmax ? t.rOver : t.rTime).replace("{h}", h).replace("{max}", hmax)}</span>` + (low ? `<span>${t.rLow.replace("{s}", esc(name(low)))}</span>` : "");
}
function renderMsgs() {
  $("msgs").innerHTML = MSG.map((m, i) => `<div class="msg"><div class="hd"><b>${esc(m[st.l][0])}</b><button type="button" class="btn" data-copy="${i}">${T().copy}</button></div><pre id="m-${i}">${esc(m[st.l][1])}</pre></div>`).join("");
}
function toast(m) { const t = $("toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toast.k); toast.k = setTimeout(() => t.classList.remove("on"), 2000); }
document.addEventListener("click", async (e) => {
  const l = e.target.closest(".lang button"); if (l) { st.l = l.dataset.l; save(); applyUI(); return; }
  const lv = e.target.closest("#mat-lvl button"); if (lv) { st.lvl = lv.dataset.v; renderMat(); return; }
  const pk = e.target.closest("[data-pick]"); if (pk) { const [i, k] = pk.dataset.pick.split(":"); st.pick[i] = st.pick[i] === k ? undefined : k; save(); renderMat(); return; }
  if (e.target.id === "add-row") { st.rows.push({ it: "", es: "", price: 0, cost: 0, min: 60 }); save(); renderCalc(); return; }
  const cp = e.target.closest("[data-copy]");
  if (cp) { const el = $("m-" + cp.dataset.copy); try { await navigator.clipboard.writeText(el.textContent); toast(T().copied); } catch (err) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast(T().sel); } }
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.dataset && el.dataset.r) { const r = st.rows[+el.dataset.r]; if (el.dataset.k === "name") { r[st.l] = el.value; } else { r[el.dataset.k] = num(el.value); }
    save(); clearTimeout(renderCalc.t); renderCalc.t = setTimeout(renderCalc, 500); return; }
  if (["c-goal", "c-fixed", "c-tax", "c-hours"].includes(el.id)) { save(); if (el.id === "c-tax") { clearTimeout(renderCalc.t); renderCalc.t = setTimeout(renderCalc, 400); } else renderResult(); }
});
applyUI();
</script>

</body>
</html>
